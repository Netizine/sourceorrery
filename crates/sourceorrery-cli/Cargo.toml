[package]
name = "sourceorrery-cli"
description = "SourceOrrery command-line interface: secrets belong to the runtime, not the repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://sourceorrery.ai/reference/cli/"
categories = ["command-line-utilities", "cryptography", "authentication"]
keywords = ["secrets", "vault", "dotenv", "keyring", "cli"]
default-run = "sourceorrery"

[[bin]]
name = "sourceorrery"
path = "src/main.rs"
# The binary shares its name with the `sourceorrery` library crate; documenting
# both collides on target/doc/sourceorrery (cargo issue 6313). The reference
# for the CLI is docs/cli.md.
doc = false

[features]
default = ["os-keyring", "ui", "remote"]
# Protect vault keys with the OS credential store. Disable for headless
# servers that only use passphrase protectors.
os-keyring = ["sourceorrery-storage/os-keyring"]
# Every remote provider a manifest can name (`[vaults.<name>]`).
remote = ["sourceorrery-provider/remote"]
# HashiCorp Vault, KV version 2.
provider-vault = ["sourceorrery-provider/provider-vault"]
# The interactive vault browser, `sourceorrery ui` (Ratatui). Nothing else
# in the CLI depends on it; disable for minimal builds.
ui = ["dep:ratatui"]

[dependencies]
sourceorrery-core.workspace = true
sourceorrery-provider.workspace = true
sourceorrery-storage.workspace = true
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
anyhow = "1"
rpassword = "7"
owo-colors = { version = "4", features = ["supports-colors"] }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
toml.workspace = true
zeroize.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"], optional = true }

[dev-dependencies]
# Cheap Argon2id parameters for the vaults unit tests create.
sourceorrery-crypto.workspace = true
tempfile.workspace = true
# Tests tamper with a vault file the way an attacker with write access would.
rusqlite = { version = "0.40", features = ["bundled"] }

[lints]
workspace = true
