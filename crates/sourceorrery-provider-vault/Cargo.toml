[package]
name = "sourceorrery-provider-vault"
description = "HashiCorp Vault (KV version 2) behind the SourceOrrery secret contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
categories = ["authentication", "asynchronous"]
keywords = ["secrets", "vault", "hashicorp", "kv", "provider"]

[dependencies]
sourceorrery-core.workspace = true
async-trait.workspace = true
base64 = "0.23"
# A request body owned by a wiping buffer (`Bytes::from_owner`), so the copy
# of a value it carries is wiped once reqwest is done with it.
bytes = "1.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Test-only back edge: Cargo strips path-only dev dependencies on publish.
sourceorrery-provider = { path = "../sourceorrery-provider" }
sourceorrery-conformance = { path = "../../tests/conformance" }
sourceorrery-storage = { path = "../sourceorrery-storage", default-features = false }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tempfile.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[lints]
workspace = true
