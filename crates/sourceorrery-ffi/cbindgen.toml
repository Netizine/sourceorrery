# cbindgen configuration for the SourceOrrery C ABI.
#
# The header is regenerated by build.rs on every build of this crate and
# committed at include/sourceorrery.h. CI fails when the committed copy is
# stale, and `cargo test -p sourceorrery-ffi` checks the same thing.

language = "C"
cpp_compat = true
include_guard = "SOURCEORRERY_H"
include_version = false
line_endings = "LF"
style = "both"
usize_is_size_t = true
documentation = true
documentation_style = "doxy"
sort_by = "None"
tab_width = 4

header = """/*
 * SourceOrrery C ABI.
 *
 * Generated by cbindgen from crates/sourceorrery-ffi. Do not edit by hand;
 * run `cargo build -p sourceorrery-ffi` and commit the result.
 *
 * Conventions
 *   - Strings in are UTF-8 byte ranges (ptr, len), never NUL-terminated.
 *     Arguments documented as nullable accept NULL for "absent".
 *   - Data out is an so_bytes buffer that the caller releases with
 *     so_bytes_free(), which zeroises the memory before freeing it. The
 *     buffer always has one extra 0 byte after `len`, so JSON outputs can be
 *     read as C strings.
 *   - Metadata crosses as JSON (snake_case keys, RFC 3339 timestamps).
 *   - Every fallible call returns an so_status. On SO_STATUS_ERROR the
 *     stable error code and a message are available from
 *     so_last_error_code() / so_last_error_message() on the same thread.
 *   - Secret values cross only as raw bytes and are never logged,
 *     formatted or embedded in JSON.
 *
 * Licensed under MIT OR Apache-2.0.
 */"""

[defines]

[export]
# Exported names already carry the `so_` prefix in Rust.
prefix = ""

[fn]
args = "vertical"

[struct]

[enum]

[parse]
parse_deps = false
