[package]
name = "sourceorrery-provider"
description = "Adapters between SourceOrrery's synchronous and asynchronous secret clients; the base of the remote providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
categories = ["asynchronous", "authentication"]
keywords = ["secrets", "vault", "async", "tokio", "provider"]

[features]
default = []
# Every remote provider.
remote = ["provider-vault", "provider-aws", "provider-azure"]
# HashiCorp Vault, KV version 2.
provider-vault = ["dep:sourceorrery-provider-vault"]
# AWS Secrets Manager.
provider-aws = ["dep:sourceorrery-provider-aws"]
# Azure Key Vault.
provider-azure = ["dep:sourceorrery-provider-azure"]

[dependencies]
sourceorrery-core.workspace = true
sourceorrery-storage.workspace = true
sourceorrery-provider-vault = { workspace = true, optional = true }
sourceorrery-provider-aws = { workspace = true, optional = true }
sourceorrery-provider-azure = { workspace = true, optional = true }
async-trait.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
time.workspace = true
tempfile.workspace = true
# To cut a vault's audit log short in the routing tests.
rusqlite = { version = "0.40", features = ["bundled"] }
# Test-only back edge: Cargo strips path-only dev dependencies on publish.
sourceorrery-conformance = { path = "../../tests/conformance" }

[lints]
workspace = true
