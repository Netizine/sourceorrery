[package]
name = "sourceorrery"
description = "Read-only SourceOrrery client: open a vault, get secrets, resolve references, load a project manifest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
categories = ["cryptography", "authentication", "config"]
keywords = ["secrets", "vault", "dotenv", "keyring", "sdk"]

[features]
default = ["os-keyring", "remote"]
# Open vaults with this machine's key in the OS credential store. Disable
# for headless servers that open vaults with their recovery keys only.
os-keyring = ["sourceorrery-storage/os-keyring"]
# Every provider a vault's connection can reach.
remote = ["sourceorrery-provider/remote"]
# HashiCorp Vault, KV version 2.
provider-vault = ["sourceorrery-provider/provider-vault"]
# AWS Secrets Manager.
provider-aws = ["sourceorrery-provider/provider-aws"]
# Azure Key Vault.
provider-azure = ["sourceorrery-provider/provider-azure"]

[dependencies]
sourceorrery-core.workspace = true
sourceorrery-provider.workspace = true
sourceorrery-storage.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
sourceorrery-crypto.workspace = true
tempfile.workspace = true
time.workspace = true

[lints]
workspace = true
