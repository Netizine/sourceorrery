name: SDK fixture
description: >-
  Builds the CLI and the C ABI (release) and creates the vault every SDK
  test suite and example reads, exporting SOURCEORRERY_HOME,
  SOURCEORRERY_PASSPHRASE, SOURCEORRERY_NATIVE_DIR and the
  SOURCEORRERY_TEST_* variables to the job environment.
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: sdk-fixture
    - name: Build the CLI and the C ABI
      shell: bash
      run: cargo build --release --locked -p sourceorrery-cli -p sourceorrery-ffi
    - name: Create the fixture vault with the CLI
      shell: bash
      run: bash scripts/ci/fixture-vault.sh "$RUNNER_TEMP/sourceorrery-home"
