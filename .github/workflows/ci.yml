name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (no OS keyring)
        run: cargo clippy -p sourceorrery-storage --no-default-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        # Tests use passphrase protectors only; no OS keyring is required on CI.
        run: cargo test --workspace --locked
      - name: Build without OS keyring support (headless servers)
        run: cargo build -p sourceorrery-cli --no-default-features --locked

  ffi-header:
    name: C ABI header
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the C ABI (build.rs regenerates include/sourceorrery.h)
        run: cargo build -p sourceorrery-ffi --locked
      - name: Committed header must match the generated one
        run: git diff --exit-code -- crates/sourceorrery-ffi/include/sourceorrery.h
      - name: Same check as a test (covers read-only source trees)
        run: cargo test -p sourceorrery-ffi --test header --locked
      - name: Build without OS keyring support (headless servers)
        run: cargo build -p sourceorrery-ffi --no-default-features --locked
      - name: Compile and run the C example against the header
        run: |
          cc -Wall -Wextra -Werror -I crates/sourceorrery-ffi/include crates/sourceorrery-ffi/examples/smoke.c -L target/debug -lsourceorrery_ffi -o /tmp/so-smoke
          LD_LIBRARY_PATH=target/debug /tmp/so-smoke "$(mktemp -d)"

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # rustsec/audit-check reports through a check run (and an issue on push).
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
