name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A full run for a commit whose push was docs-only, so it can be released:
  # the change classifier treats a dispatch as code, and the release gate
  # (scripts/release/check-release-validation.py) accepts a dispatched run.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------------
  # Docs-only changes skip the build. This job lists the changed files
  # (scripts/ci/classify-changes.sh); when every one is documentation
  # (docs/, site/, Markdown or images outside crates/ and bindings/) it
  # outputs code=false and every job below is skipped. The CI gate counts
  # skipped as passed, so a docs-only pull request merges after this job
  # and the gate alone, and docs.yml builds and link-checks the site.
  # When the diff cannot be computed, everything runs.
  # ---------------------------------------------------------------------
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - name: Docs-only or code
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/ci/classify-changes.sh

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (no OS keyring)
        run: cargo clippy -p sourceorrery-storage --no-default-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        # Tests use recovery keys and an in-memory credential store; no OS
        # keyring is required on CI.
        run: cargo test --workspace --locked
      - name: Build without OS keyring support (headless servers)
        run: cargo build -p sourceorrery-cli --no-default-features --locked

  ffi-header:
    name: C ABI header
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the C ABI (build.rs regenerates include/sourceorrery.h)
        run: cargo build -p sourceorrery-ffi --locked
      - name: Committed header must match the generated one
        run: git diff --exit-code -- crates/sourceorrery-ffi/include/sourceorrery.h
      - name: Same check as a test (covers read-only source trees)
        run: cargo test -p sourceorrery-ffi --test header --locked
      - name: Build without OS keyring support (headless servers)
        run: cargo build -p sourceorrery-ffi --no-default-features --locked
      - name: Compile and run the C example against the header
        run: |
          cc -Wall -Wextra -Werror -I crates/sourceorrery-ffi/include crates/sourceorrery-ffi/examples/smoke.c -L target/debug -lsourceorrery_ffi -o /tmp/so-smoke
          LD_LIBRARY_PATH=target/debug /tmp/so-smoke "$(mktemp -d)"
      - name: The Go module vendors the same header
        run: diff -u crates/sourceorrery-ffi/include/sourceorrery.h bindings/go/sourceorrery.h
      # ADR 0007: a declaration the previous release had may not change or
      # disappear unless SO_ABI_VERSION moves in the same change.
      - name: The header is compatible with the previous release
        run: |
          set -euo pipefail
          git fetch --quiet --tags origin
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          mkdir -p target
          git show "$tag:crates/sourceorrery-ffi/include/sourceorrery.h" > target/abi-baseline.h
          python3 scripts/ci/abi-check.py --baseline target/abi-baseline.h \
            --current crates/sourceorrery-ffi/include/sourceorrery.h --baseline-name "$tag"

  # The native extension crates live outside the workspace (maturin and
  # napi build them); lint them the same way.
  bindings-lint:
    name: clippy (native extensions)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            bindings/python
            bindings/node
      - run: cargo fmt --check
        working-directory: bindings/python
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: bindings/python
      - run: cargo fmt --check
        working-directory: bindings/node
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: bindings/node

  # REC09: the declared minimum Rust is built and tested, not inferred from
  # dependency metadata: the workspace and both native extensions declare
  # one `rust-version`, and on that toolchain the workspace's tests pass and
  # every supported feature combination builds (scripts/ci/feature-matrix.sh,
  # whose headless builds also run their tests). rust-toolchain.toml selects
  # stable, so RUSTUP_TOOLCHAIN overrides it.
  msrv:
    name: minimum Rust and feature combinations
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The declared minimum, the same in every manifest
        id: msrv
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import sys, tomllib
          def declared(path, *keys):
              with open(path, "rb") as file:
                  value = tomllib.load(file)
              for key in keys:
                  value = value[key]
              return value
          version = declared("Cargo.toml", "workspace", "package", "rust-version")
          for path in ("bindings/python/Cargo.toml", "bindings/node/Cargo.toml"):
              other = declared(path, "package", "rust-version")
              if other != version:
                  sys.exit(f"::error::{path} declares Rust {other}, the workspace {version}")
          print(f"version={version}")
          EOF
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            bindings/python
            bindings/node
      - name: The workspace builds and its tests pass on the minimum
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo test --workspace --locked
      - name: Every supported feature combination, on the minimum
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: bash scripts/ci/feature-matrix.sh

  # ---------------------------------------------------------------------
  # SDKs: every binding builds, its tests pass and its example runs against
  # a vault the CLI created in the job (opening with its recovery key,
  # SOURCEORRERY_RECOVERY_KEY in the environment). See docs/sdks/index.md.
  # ---------------------------------------------------------------------

  sdk-rust:
    name: SDK Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/sdk-fixture
      - name: Example
        shell: bash
        run: cargo run --release --locked -p sourceorrery --example get_secret -- "$SOURCEORRERY_TEST_VAULT" database-password
      - name: Example reports a missing secret with a hint
        shell: bash
        run: |
          if cargo run --release --locked -p sourceorrery --example get_secret -- "$SOURCEORRERY_TEST_VAULT" missing 2> err.txt; then exit 1; fi
          grep -q 'not_found' err.txt && grep -q 'sourceorrery secret set missing' err.txt
      - name: Conformance harness
        shell: bash
        run: |
          cargo build --release --locked -p sourceorrery --example conformance
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} tests/conformance/sdk/harness.py --runner rust

  sdk-python:
    name: SDK Python (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/sdk-fixture
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        shell: bash
        # The tools come pinned with their hashes and as wheels only; the SDK is
        # built by maturin itself and installed from that wheel, so pip runs no
        # package's setup code.
        run: |
          python -m pip install --require-hashes --only-binary :all: -r bindings/python/ci-requirements.txt
          maturin build --release --locked -m bindings/python/Cargo.toml -o dist/python
          # The SDK wheel just built, pinned by its own hash like the tools above.
          python -c 'import hashlib, pathlib; w = next(pathlib.Path("dist/python").glob("sourceorrery-*.whl")).resolve(); print(f"sourceorrery @ {w.as_uri()} --hash=sha256:{hashlib.sha256(w.read_bytes()).hexdigest()}")' > dist/python/requirements.txt
          python -m pip install --require-hashes --only-binary :all: --no-index --no-deps -r dist/python/requirements.txt
      - name: Tests
        shell: bash
        run: python -m pytest bindings/python/tests -v
      - name: Example
        shell: bash
        run: python bindings/python/examples/get_secret.py "$SOURCEORRERY_TEST_VAULT" database-password
      - name: Conformance harness
        shell: bash
        run: python tests/conformance/sdk/harness.py --runner python

  sdk-node:
    name: SDK Node.js (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: bindings/node
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/sdk-fixture
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - name: Examples (JavaScript and TypeScript)
        run: |
          node examples/get-secret.mjs "$SOURCEORRERY_TEST_VAULT" database-password
          node --experimental-strip-types --no-warnings examples/get-secret.ts "$SOURCEORRERY_TEST_VAULT" database-password
      - name: Conformance harness
        working-directory: ${{ github.workspace }}
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} tests/conformance/sdk/harness.py --runner node

  sdk-c-cpp:
    name: SDK C and C++ (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/sdk-fixture
      - name: Compile and run (cc / c++)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          inc=(-I crates/sourceorrery-ffi/include -I bindings/cpp/include)
          cc -Wall -Wextra -Werror "${inc[@]}" crates/sourceorrery-ffi/examples/get_secret.c -L "$SOURCEORRERY_NATIVE_DIR" -lsourceorrery_ffi -o get_secret_c
          c++ -std=c++17 -Wall -Wextra -Werror "${inc[@]}" bindings/cpp/examples/get_secret.cpp -L "$SOURCEORRERY_NATIVE_DIR" -lsourceorrery_ffi -o get_secret_cpp
          c++ -std=c++17 -Wall -Wextra -Werror "${inc[@]}" bindings/cpp/tests/reader_test.cpp -L "$SOURCEORRERY_NATIVE_DIR" -lsourceorrery_ffi -o reader_test
          mkdir -p build
          cc -Wall -Wextra -Werror "${inc[@]}" crates/sourceorrery-ffi/examples/conformance.c -L "$SOURCEORRERY_NATIVE_DIR" -lsourceorrery_ffi -o build/conformance_c
          c++ -std=c++17 -Wall -Wextra -Werror "${inc[@]}" bindings/cpp/conformance/run.cpp -L "$SOURCEORRERY_NATIVE_DIR" -lsourceorrery_ffi -o build/conformance_cpp
          export LD_LIBRARY_PATH="$SOURCEORRERY_NATIVE_DIR" DYLD_LIBRARY_PATH="$SOURCEORRERY_NATIVE_DIR"
          ./reader_test
          ./get_secret_c "$SOURCEORRERY_TEST_VAULT" database-password
          ./get_secret_cpp "$SOURCEORRERY_TEST_VAULT" database-password
          python3 tests/conformance/sdk/harness.py --runner c
          python3 tests/conformance/sdk/harness.py --runner cpp
      - name: Compile and run (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        # The Visual Studio developer environment, from the runner's own
        # installation (no action: the ones that do this still run on Node 20).
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSROOT=%%i
          if not defined VSROOT exit /b 1
          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64 -no_logo || exit /b 1
          set INC=/I crates/sourceorrery-ffi/include /I bindings/cpp/include
          cl /nologo /W4 /WX %INC% crates/sourceorrery-ffi/examples/get_secret.c /Fe:get_secret_c.exe /link "%SOURCEORRERY_NATIVE_DIR%/sourceorrery_ffi.dll.lib" || exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX %INC% bindings/cpp/examples/get_secret.cpp /Fe:get_secret_cpp.exe /link "%SOURCEORRERY_NATIVE_DIR%/sourceorrery_ffi.dll.lib" || exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX %INC% bindings/cpp/tests/reader_test.cpp /Fe:reader_test.exe /link "%SOURCEORRERY_NATIVE_DIR%/sourceorrery_ffi.dll.lib" || exit /b 1
          if not exist build mkdir build
          cl /nologo /W4 /WX %INC% crates/sourceorrery-ffi/examples/conformance.c /Fe:build/conformance_c.exe /link "%SOURCEORRERY_NATIVE_DIR%/sourceorrery_ffi.dll.lib" || exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX %INC% bindings/cpp/conformance/run.cpp /Fe:build/conformance_cpp.exe /link "%SOURCEORRERY_NATIVE_DIR%/sourceorrery_ffi.dll.lib" || exit /b 1
          set PATH=%SOURCEORRERY_NATIVE_DIR%;%PATH%
          reader_test.exe || exit /b 1
          get_secret_c.exe %SOURCEORRERY_TEST_VAULT% database-password || exit /b 1
          get_secret_cpp.exe %SOURCEORRERY_TEST_VAULT% database-password || exit /b 1
          python tests/conformance/sdk/harness.py --runner c || exit /b 1
          python tests/conformance/sdk/harness.py --runner cpp || exit /b 1
      - name: CMake build of the C++ SDK
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S bindings/cpp -B build/cpp -DSOURCEORRERY_NATIVE_DIR="$SOURCEORRERY_NATIVE_DIR"
          cmake --build build/cpp

  sdk-go:
    name: SDK Go (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: bindings/go
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/sdk-fixture
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache-dependency-path: bindings/go/go.sum
      - name: Vendored header is current
        run: diff -u ../../crates/sourceorrery-ffi/include/sourceorrery.h sourceorrery.h
      - name: Tests and example
        env:
          CGO_ENABLED: "1"
        run: |
          export CGO_LDFLAGS="-L$SOURCEORRERY_NATIVE_DIR"
          # Git Bash splits PATH on ':', so a D:/... entry must be given in POSIX form.
          native="$SOURCEORRERY_NATIVE_DIR"
          case "$(uname -s)" in MINGW*|MSYS*) native="$(cygpath -u "$native")" ;; esac
          export LD_LIBRARY_PATH="$SOURCEORRERY_NATIVE_DIR" DYLD_LIBRARY_PATH="$SOURCEORRERY_NATIVE_DIR" PATH="$native:$PATH"
          gofmt -l . && test -z "$(gofmt -l .)"
          go vet ./...
          go test -v ./...
          go run ./examples/get-secret "$SOURCEORRERY_TEST_VAULT" database-password
          go build -o "conformance-go$([ "$RUNNER_OS" = Windows ] && echo .exe)" ./conformance
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} ../../tests/conformance/sdk/harness.py --runner go

  sdk-java:
    name: SDK Java (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    # A hung test fails the job in minutes, not at the six-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: bindings/java
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/sdk-fixture
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Tests
        run: mvn -B --no-transfer-progress test
      - name: Example
        run: java --enable-native-access=ALL-UNNAMED -cp target/classes examples/GetSecret.java "$SOURCEORRERY_TEST_VAULT" database-password
      - name: Conformance harness
        working-directory: ${{ github.workspace }}
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} tests/conformance/sdk/harness.py --runner java

  sdk-dotnet:
    name: SDK .NET (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/sdk-fixture
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Tests
        shell: bash
        run: dotnet test bindings/dotnet/SourceOrrery.sln --nologo
      - name: Example
        shell: bash
        run: dotnet run --project bindings/dotnet/examples/GetSecret -- "$SOURCEORRERY_TEST_VAULT" database-password
      - name: Pack (no native libraries; the release workflow adds them)
        shell: bash
        run: dotnet pack bindings/dotnet/SourceOrrery/SourceOrrery.csproj --nologo -c Release -o dist/nuget
      - name: Conformance harness
        shell: bash
        run: |
          dotnet build bindings/dotnet/conformance -c Release --nologo
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} tests/conformance/sdk/harness.py --runner dotnet

  sdk-php:
    name: SDK PHP (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/sdk-fixture
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: ffi, json
          ini-values: ffi.enable=true
      - name: The manifest Packagist reads is valid
        shell: bash
        run: composer validate --strict composer.json
      # Any semver does: the tag is created in a scratch copy of the checkout.
      # Git Bash hands Composer POSIX temp paths on Windows, so Unix runners only.
      - name: The package installs from a tag through Composer
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/php-package-install.sh 0.0.0
      - name: Tests
        shell: bash
        run: php bindings/php/tests/run.php
      - name: Example
        shell: bash
        run: php bindings/php/examples/get_secret.php "$SOURCEORRERY_TEST_VAULT" database-password
      - name: Conformance harness
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} tests/conformance/sdk/harness.py --runner php

  docs:
    name: rustdoc
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --locked

  audit:
    name: dependency audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Every dependency graph (scripts/ci/dependency-audit.py, its inventory
    # in docs/supply-chain.md): cargo-audit for the three Cargo.lock files,
    # npm audit for the four package-lock.json files (lock file only: no
    # install, no private registry), the OSV.dev API for the pinned Python
    # requirements and the Maven and NuGet references. A vulnerability, a
    # scanner that fails or a lock file the inventory does not cover fails
    # the job; a maintenance warning not reviewed there is a warning here
    # and fails a release (--strict).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit@0.22.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: python3 scripts/ci/dependency-audit.py

  # Workflow hygiene: zizmor fails on an unpinned third-party action, on a
  # `run:` step that expands an expression, and on the other high-severity
  # workflow patterns. The zizmor version is fixed so a new audit cannot
  # turn the gate red on its own; raise it deliberately, together with the
  # threshold once the medium findings in the Azure workflow are addressed.
  workflows:
    name: workflows (zizmor)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          min-severity: high
          min-confidence: high
          # Plain output; no upload to the Security tab.
          advanced-security: "false"

  # The release scripts are Python; their unit tests run here so a broken
  # renderer is caught before a release run needs it.
  scripts:
    name: release scripts (python)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest -v scripts/release/package_managers_test.py
      - run: python3 -m unittest -v scripts/release/npm_platform_packages_test.py
      - run: python3 -m unittest -v scripts/release/set_version_test.py
      - run: python3 -m unittest -v scripts/release/test_publish_crates.py
      - run: python3 -m unittest -v scripts/ci/abi_check_test.py
      - run: python3 -m unittest -v scripts/ci/azure_vault_test.py
      - run: python3 -m unittest -v scripts/ci/dependency_audit_test.py
      - run: python3 -m unittest -v scripts/release/check_release_validation_test.py
      - run: python3 -m unittest -v scripts/release/verify_release_artifacts_test.py
      - run: python3 -m unittest -v scripts/release/docs_version_test.py
      - run: python3 -m unittest -v tests/conformance/sdk/harness_test.py

  # ADR 0007: the library built from this commit must still pass the
  # conformance contract of the latest release: its C runner, compiled
  # against its own header, driven by its own harness and scenarios, over a
  # fixture its own script creates with the current CLI. Skipped when
  # SO_ABI_VERSION was bumped since that release (the old runner is then
  # expected to refuse the library, which the bindings' load-time check
  # covers).
  abi-compat:
    name: C ABI compatible with the previous release
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux build dependencies (Secret Service)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config
      - name: Check out the previous release next to the tree
        id: previous
        run: |
          set -euo pipefail
          git fetch --quiet --tags origin
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          git worktree add --quiet previous "$tag"
          before="$(grep -E '^#define SO_ABI_VERSION' previous/crates/sourceorrery-ffi/include/sourceorrery.h | awk '{print $3}')"
          now="$(grep -E '^#define SO_ABI_VERSION' crates/sourceorrery-ffi/include/sourceorrery.h | awk '{print $3}')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$now" ]; then
            echo "same_abi=true" >> "$GITHUB_OUTPUT"
          else
            echo "same_abi=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SO_ABI_VERSION moved from $before ($tag) to $now; the previous release's runner is not expected to work"
          fi
      - name: Build the current CLI and C ABI library
        if: steps.previous.outputs.same_abi == 'true'
        run: cargo build --release --locked -p sourceorrery-cli -p sourceorrery-ffi
      - name: The previous release's fixture, made with the current CLI
        if: steps.previous.outputs.same_abi == 'true'
        env:
          SOURCEORRERY_CLI: ${{ github.workspace }}/target/release/sourceorrery
          SOURCEORRERY_NATIVE_DIR: ${{ github.workspace }}/target/release
        run: bash previous/scripts/ci/fixture-vault.sh
      - name: The previous release's C runner against the current library
        if: steps.previous.outputs.same_abi == 'true'
        env:
          TAG: ${{ steps.previous.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p build
          cc -Wall -Wextra -Werror -I previous/crates/sourceorrery-ffi/include \
            previous/crates/sourceorrery-ffi/examples/conformance.c \
            -L "$SOURCEORRERY_NATIVE_DIR" -lsourceorrery_ffi -o build/conformance_c_previous
          export LD_LIBRARY_PATH="$SOURCEORRERY_NATIVE_DIR"
          echo "running the $TAG contract against the library built from $GITHUB_SHA"
          cd previous
          python3 tests/conformance/sdk/harness.py --command "$GITHUB_WORKSPACE/build/conformance_c_previous"

  # This machine's key in a real credential store, headless: a
  # temporary keychain on macOS, GNOME Keyring under a private session bus
  # on Linux, Credential Manager on Windows. The same scripts are what a
  # person runs in a desktop session (docs/threat-model.md); this keeps the
  # path from rotting between those runs. Nothing here touches the runner
  # user's own store beyond the entries the script creates and removes.
  keyring:
    name: OS keyring (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux build dependencies and a Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config gnome-keyring libsecret-tools
      - name: Build the CLI
        run: cargo build -p sourceorrery-cli --locked
      # `--unlock` with an empty password creates and unlocks the login
      # keyring and makes it the default collection; `--start` then serves it
      # on the session bus. Without an unlocked default collection the
      # Secret Service answers every store with a prompt no one can answer.
      - name: Smoke test against GNOME Keyring on a private session bus
        if: runner.os == 'Linux'
        run: |
          # Expansion belongs to the child shell inside the private session.
          # shellcheck disable=SC2016
          dbus-run-session -- bash -c '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock 2>/dev/null)"
            eval "$(printf "\n" | gnome-keyring-daemon --start 2>/dev/null)"
            export GNOME_KEYRING_CONTROL SSH_AUTH_SOCK
            sleep 1
            bash scripts/dev/keyring-smoke.sh target/debug/sourceorrery
          '
      - name: Smoke test against a temporary keychain
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/smoke.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security default-keychain -s "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          trap 'security delete-keychain "$keychain"' EXIT
          bash scripts/dev/keyring-smoke.sh target/debug/sourceorrery
      - name: Smoke test against Credential Manager
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh scripts/dev/keyring-smoke.ps1 -Cli target\debug\sourceorrery.exe

  # ---------------------------------------------------------------------
  # The one status check branch protection on `main` requires. It passes
  # when every job above passed or was skipped and fails on any other
  # result. A job that is not in `needs:` is not enforced, so every new job
  # must be added here; give it `needs: changes` and the same `if:` as the
  # others so that docs-only changes skip it too.
  # ---------------------------------------------------------------------
  provider-vault:
    name: provider HashiCorp Vault
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:2.2.1
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: --cap-add=IPC_LOCK
    env:
      SOURCEORRERY_VAULT_TEST_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: root
      # The server always runs here: a live test cannot pass unrun.
      SOURCEORRERY_LIVE_REQUIRED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for the dev server
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "Vault did not come up"; exit 1
      - uses: ./.github/actions/sdk-fixture
      - name: Lifecycle conformance, canaries and error mapping against the server
        run: cargo test --locked -p sourceorrery-provider-vault
      - name: Secrets the vault keeps at the server, through the CLI and the SDK harness
        # The fixture vault again, made with a connection to the server that
        # stores its token: the CLI keeps the remote fixture there, and the
        # Rust and C runners read it back through the same vault (the
        # scenarios marked `requires: remote`), with no VAULT_TOKEN in the
        # environment.
        run: |
          curl -sf -o /dev/null -X POST -H "X-Vault-Token: root" -d '{"type":"kv","options":{"version":"2"}}' http://127.0.0.1:8200/v1/sys/mounts/harness-remote
          printf 'root' > "$RUNNER_TEMP/vault-token"
          unset VAULT_TOKEN
          env -u GITHUB_ENV bash scripts/ci/fixture-vault.sh "$RUNNER_TEMP/remote-home" \
            --hashicorp-vault http://127.0.0.1:8200 --hashicorp-vault-mount harness-remote \
            --hashicorp-vault-token-file "$RUNNER_TEMP/vault-token" > "$RUNNER_TEMP/remote-fixture.env"
          . "$RUNNER_TEMP/remote-fixture.env"
          rm -f "$RUNNER_TEMP/vault-token" "$RUNNER_TEMP/remote-fixture.env"
          cargo build --release --locked -p sourceorrery --example conformance
          python3 tests/conformance/sdk/harness.py --runner rust --remote --remote-per-version
          mkdir -p build
          cc -Wall -Wextra -Werror -I crates/sourceorrery-ffi/include crates/sourceorrery-ffi/examples/conformance.c -L "$SOURCEORRERY_NATIVE_DIR" -lsourceorrery_ffi -o build/conformance_c
          LD_LIBRARY_PATH="$SOURCEORRERY_NATIVE_DIR" python3 tests/conformance/sdk/harness.py --runner c --remote --remote-per-version
      - name: Platform identity and policy enforcement (AppRole, JWT, metadata-only policy, revocation)
        # Logs in without a stored token, reads with the policy's permission,
        # and is refused exactly where the policy says (`check --access`).
        run: bash scripts/ci/vault-federation.sh

  provider-aws:
    name: provider AWS Secrets Manager
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # LocalStack, started by lstk with the image pinned in .lstk/config.toml.
    # Its CI auth token is a repository secret, which pull requests from
    # forks never receive (they run no code with it): there the emulator
    # steps are skipped with a warning and run again once merged. Any other
    # run without the token fails. Only the steps that run lstk see it.
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the emulator
        id: emulator
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          FORK: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }}
        run: bash scripts/ci/localstack.sh select aws
      - name: Start LocalStack (lstk returns once it is ready)
        if: steps.emulator.outputs.available == 'true'
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: bash scripts/ci/localstack.sh start aws
      - uses: ./.github/actions/sdk-fixture
      - name: Lifecycle conformance (without per-version properties) and the provider's own tests
        # --show-output prints the warning a test gives for an emulator
        # divergence (tests/live.rs) as a workflow annotation, and what the
        # live tests ran against. With the emulator up they cannot pass
        # without running.
        env:
          SOURCEORRERY_LIVE_REQUIRED: ${{ steps.emulator.outputs.available }}
        run: cargo test --locked -p sourceorrery-provider-aws -- --show-output
      - name: Secrets the vault keeps at the emulator, through the CLI and the SDK harness
        if: steps.emulator.outputs.available == 'true'
        # As in provider-vault: the connection stores the access key, and the
        # environment has none. AWS keeps properties per secret, so no
        # --remote-per-version.
        run: |
          printf 'test' > "$RUNNER_TEMP/aws-secret-access-key"
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          env -u GITHUB_ENV bash scripts/ci/fixture-vault.sh "$RUNNER_TEMP/remote-home" \
            --aws-secrets-manager us-east-1 --aws-secrets-manager-prefix harness/ \
            --aws-secrets-manager-endpoint http://127.0.0.1:4566 \
            --aws-access-key-id test --aws-secret-access-key-file "$RUNNER_TEMP/aws-secret-access-key" \
            > "$RUNNER_TEMP/remote-fixture.env"
          . "$RUNNER_TEMP/remote-fixture.env"
          rm -f "$RUNNER_TEMP/aws-secret-access-key" "$RUNNER_TEMP/remote-fixture.env"
          cargo build --release --locked -p sourceorrery --example conformance
          python3 tests/conformance/sdk/harness.py --runner rust --remote
          mkdir -p build
          cc -Wall -Wextra -Werror -I crates/sourceorrery-ffi/include crates/sourceorrery-ffi/examples/conformance.c -L "$SOURCEORRERY_NATIVE_DIR" -lsourceorrery_ffi -o build/conformance_c
          LD_LIBRARY_PATH="$SOURCEORRERY_NATIVE_DIR" python3 tests/conformance/sdk/harness.py --runner c --remote
      - name: Platform identity (web identity at STS) and no-credentials refusal
        if: steps.emulator.outputs.available == 'true'
        run: bash scripts/ci/aws-federation.sh
      - name: LocalStack logs
        if: always() && steps.emulator.outputs.available == 'true'
        env:
          # Only to remove it from the files uploaded below.
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: bash scripts/ci/localstack.sh logs aws
      - name: Keep the LocalStack logs of a failed run
        if: failure() && steps.emulator.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: localstack-logs-provider-aws
          path: ${{ runner.temp }}/localstack/
          if-no-files-found: warn
          retention-days: 7

  provider-azure:
    name: provider Azure Key Vault
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # LocalStack for Azure, started by lstk from .lstk/azure.toml (image
    # pinned by digest, role-based access enforced). Its auth token is the
    # repository secret LOCALSTACK_AZURE_AUTH_TOKEN, given only to the steps
    # that run lstk; pull requests from forks never receive it, so there the
    # emulator steps are skipped with a warning. The identity is the
    # emulator's placeholder service principal, exported by `select`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the emulator
        id: emulator
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AZURE_AUTH_TOKEN }}
          FORK: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }}
        run: bash scripts/ci/localstack.sh select azure
      - name: Start LocalStack for Azure (lstk returns once it is ready)
        if: steps.emulator.outputs.available == 'true'
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AZURE_AUTH_TOKEN }}
        run: bash scripts/ci/localstack.sh start azure
      - uses: ./.github/actions/sdk-fixture
      - name: Lifecycle conformance (with per-version properties) and the provider's own tests
        # With the emulator up the live tests cannot pass without running.
        env:
          SOURCEORRERY_LIVE_REQUIRED: ${{ steps.emulator.outputs.available }}
        run: cargo test --locked -p sourceorrery-provider-azure -- --show-output
      - name: Secrets the vault keeps at the emulator, through the CLI and the SDK harness
        if: steps.emulator.outputs.available == 'true'
        # As in provider-vault: the connection stores the service principal,
        # and the environment has none. AZURE_AUTHORITY_HOST stays: it names
        # the emulator's sign-in authority.
        run: |
          vault_url="$(python3 scripts/ci/azure-vault.py harness-remote)"
          printf '%s' "$AZURE_CLIENT_SECRET" > "$RUNNER_TEMP/azure-client-secret"
          tenant="$AZURE_TENANT_ID" client="$AZURE_CLIENT_ID"
          unset AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET
          env -u GITHUB_ENV bash scripts/ci/fixture-vault.sh "$RUNNER_TEMP/remote-home" \
            --azure-key-vault "$vault_url" --azure-tenant-id "$tenant" --azure-client-id "$client" \
            --azure-client-secret-file "$RUNNER_TEMP/azure-client-secret" > "$RUNNER_TEMP/remote-fixture.env"
          . "$RUNNER_TEMP/remote-fixture.env"
          rm -f "$RUNNER_TEMP/azure-client-secret" "$RUNNER_TEMP/remote-fixture.env"
          cargo build --release --locked -p sourceorrery --example conformance
          python3 tests/conformance/sdk/harness.py --runner rust --remote --remote-per-version
          mkdir -p build
          cc -Wall -Wextra -Werror -I crates/sourceorrery-ffi/include crates/sourceorrery-ffi/examples/conformance.c -L "$SOURCEORRERY_NATIVE_DIR" -lsourceorrery_ffi -o build/conformance_c
          LD_LIBRARY_PATH="$SOURCEORRERY_NATIVE_DIR" python3 tests/conformance/sdk/harness.py --runner c --remote --remote-per-version
      - name: A service principal reads, an identity without a role and no identity are refused
        if: steps.emulator.outputs.available == 'true'
        run: bash scripts/ci/azure-federation.sh
      - name: LocalStack logs
        if: always() && steps.emulator.outputs.available == 'true'
        env:
          # Only to remove it from the files uploaded below.
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AZURE_AUTH_TOKEN }}
        run: bash scripts/ci/localstack.sh logs azure
      - name: Keep the LocalStack logs of a failed run
        if: failure() && steps.emulator.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: localstack-logs-provider-azure
          path: ${{ runner.temp }}/localstack/
          if-no-files-found: warn
          retention-days: 7

  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - fmt
      - clippy
      - test
      - ffi-header
      - bindings-lint
      - msrv
      - sdk-rust
      - sdk-python
      - sdk-node
      - sdk-c-cpp
      - sdk-go
      - sdk-java
      - sdk-dotnet
      - sdk-php
      - docs
      - audit
      - workflows
      - scripts
      - abi-compat
      - keyring
      - provider-vault
      - provider-aws
      - provider-azure
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Only success and skipped pass. Anything else fails, including
          # results GitHub does not document: a macOS job that no runner
          # ever picked up reported "abandoned" and used to slip through.
          status=0
          for job in $(jq -r 'keys[]' <<< "$NEEDS"); do
            result="$(jq -r --arg job "$job" '.[$job].result' <<< "$NEEDS")"
            echo "$job: $result"
            case "$result" in success|skipped) ;; *) status=1 ;; esac
          done
          exit "$status"
