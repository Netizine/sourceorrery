name: Coverage and SonarCloud

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: All-language coverage
    # Sonar analysis and the LocalStack emulators need repository secrets,
    # which pull requests from forks and from Dependabot do not get. They
    # still run the normal CI; coverage runs after a trusted merge.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Match normal CI's disposable provider servers; no cloud account is used.
    # LocalStack for Azure, then for AWS, is started by lstk below
    # (.lstk/azure.toml and .lstk/config.toml pin the images).
    services:
      vault:
        image: hashicorp/vault:2.2.1
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: --cap-add=IPC_LOCK
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      ASTRO_TELEMETRY_DISABLED: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      SOURCEORRERY_VAULT_TEST_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: root
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            bindings/node/package-lock.json
            site/package-lock.json
            scripts/coverage/package-lock.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
          cache: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          extensions: ffi, json
          ini-values: ffi.enable=true
          coverage: xdebug

      - name: Install native and coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libdbus-1-dev lcov
          python -m pip install --require-hashes --only-binary :all: -r scripts/coverage/requirements.txt
          dotnet tool restore

      - uses: ./.github/actions/sdk-fixture

      - name: Install LLVM coverage support
        run: rustup component add llvm-tools-preview

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Install Node SDK and coverage dependencies
        run: |
          npm ci --ignore-scripts --prefix bindings/node
          npm ci --ignore-scripts --prefix scripts/coverage

      - name: Install site dependencies
        working-directory: site
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: npm ci --ignore-scripts

      # The Azure and AWS emulators bind the same ports, so the Azure
      # provider's live coverage is collected first, on its own, and merged
      # by the collect stage. This job never runs for a fork, so the tokens
      # must be there; only the steps that run lstk see them.
      - name: Select the Azure emulator
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AZURE_AUTH_TOKEN }}
          FORK: 'false'
        run: bash scripts/ci/localstack.sh select azure

      - name: Start LocalStack for Azure (lstk returns once it is ready)
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AZURE_AUTH_TOKEN }}
        run: bash scripts/ci/localstack.sh start azure

      - name: Azure Key Vault provider coverage against the emulator
        run: bash scripts/coverage/native.sh azure

      - name: LocalStack for Azure logs
        if: always()
        env:
          # Only to remove it from the files uploaded below.
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AZURE_AUTH_TOKEN }}
        run: bash scripts/ci/localstack.sh logs azure

      - name: Stop LocalStack for Azure
        if: always()
        run: bash scripts/ci/localstack.sh stop azure

      - name: Select the AWS emulator
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          FORK: 'false'
        run: bash scripts/ci/localstack.sh select aws

      - name: Start LocalStack for AWS (lstk returns once it is ready)
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: bash scripts/ci/localstack.sh start aws

      - name: Wait for the Vault test server
        run: |
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8200/v1/sys/health >/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'The Vault test server did not start' >&2
          exit 1

      - name: Collect Rust, provider, SDK and site coverage
        run: bash scripts/coverage/run.sh --stage collect

      - name: Select Sonar analysis
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::SONAR_TOKEN is missing. Coverage will be generated, but not uploaded to SonarCloud.'
            echo 'Coverage reports only: add the SONAR_TOKEN repository secret and disable Automatic Analysis in SonarCloud to enable CI analysis.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Begin SonarCloud analysis
        if: steps.sonar.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: bash scripts/sonar/scan.sh begin

      - name: Build all analysis projects
        run: dotnet build SourceOrrery.Analysis.Source.csproj -c Release --no-incremental --disable-build-servers

      - name: .NET coverage
        run: bash scripts/coverage/run.sh --stage dotnet --no-build

      - name: Verify every coverage report
        run: bash scripts/coverage/run.sh --stage verify

      - name: Upload analysis to SonarCloud
        if: steps.sonar.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: bash scripts/sonar/scan.sh end

      - name: LocalStack for AWS logs
        if: always()
        env:
          # Only to remove it from the files uploaded below.
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: bash scripts/ci/localstack.sh logs aws

      - name: Keep the LocalStack logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: localstack-logs-coverage
          path: ${{ runner.temp }}/localstack/
          if-no-files-found: warn
          retention-days: 7

      - name: Keep coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            coverage/*.lcov
            coverage/*.xml
            coverage/go.out
            coverage/node/lcov.info
            coverage/site/lcov.info
            coverage/tooling-node/lcov.info
            bindings/java/target/site/jacoco/jacoco.xml
          if-no-files-found: warn
          retention-days: 14
