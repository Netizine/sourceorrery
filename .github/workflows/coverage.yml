name: Coverage and SonarCloud

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: All-language coverage
    # The private Font Awesome package and Sonar analysis need repository secrets.
    # Fork contributions still run the normal CI; analyze after a trusted merge.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Match normal CI's disposable provider servers; no cloud account is used.
    services:
      vault:
        image: hashicorp/vault:2.2.1
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: --cap-add=IPC_LOCK
      moto:
        image: motoserver/moto:5.2.4
        ports:
          - 4566:5000
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      ASTRO_TELEMETRY_DISABLED: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      SOURCEORRERY_VAULT_TEST_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: root
      SOURCEORRERY_AWS_TEST_ENDPOINT: http://127.0.0.1:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Correct Moto's stored version timestamps
        env:
          MOTO_CONTAINER_ID: ${{ job.services.moto.id }}
        run: python3 scripts/ci/moto-version-timestamps.py --container "$MOTO_CONTAINER_ID"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            bindings/node/package-lock.json
            site/package-lock.json
            scripts/coverage/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
          cache: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          extensions: ffi, json
          ini-values: ffi.enable=true
          coverage: xdebug

      - name: Install native and coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libdbus-1-dev lcov
          python -m pip install --require-hashes --only-binary :all: -r scripts/coverage/requirements.txt
          dotnet tool restore

      - uses: ./.github/actions/sdk-fixture

      - name: Install LLVM coverage support
        run: rustup component add llvm-tools-preview

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Install Node SDK and coverage dependencies
        run: |
          npm ci --ignore-scripts --prefix bindings/node
          npm ci --ignore-scripts --prefix scripts/coverage

      - name: Install site dependencies
        working-directory: site
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Wait for provider test servers
        run: |
          for service in http://127.0.0.1:8200/v1/sys/health http://127.0.0.1:4566/moto-api/; do
            ready=false
            for _attempt in $(seq 1 60); do
              if curl --fail --silent "$service" >/dev/null; then ready=true; break; fi
              sleep 1
            done
            if [ "$ready" != true ]; then echo "Provider test server did not start: $service" >&2; exit 1; fi
          done

      - name: Collect Rust, provider, SDK and site coverage
        run: bash scripts/coverage/run.sh --stage collect

      - name: Select Sonar analysis
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::SONAR_TOKEN is missing. Coverage will be generated, but not uploaded to SonarCloud.'
            echo 'Coverage reports only: add the SONAR_TOKEN repository secret and disable Automatic Analysis in SonarCloud to enable CI analysis.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Begin SonarCloud analysis
        if: steps.sonar.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: bash scripts/sonar/scan.sh begin

      - name: Build all analysis projects
        run: dotnet build SourceOrrery.Analysis.Source.csproj -c Release --no-incremental --disable-build-servers

      - name: .NET coverage
        run: bash scripts/coverage/run.sh --stage dotnet --no-build

      - name: Verify every coverage report
        run: bash scripts/coverage/run.sh --stage verify

      - name: Upload analysis to SonarCloud
        if: steps.sonar.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: bash scripts/sonar/scan.sh end

      - name: Keep coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-reports
          path: |
            coverage/*.lcov
            coverage/*.xml
            coverage/go.out
            coverage/node/lcov.info
            coverage/site/lcov.info
            bindings/java/target/site/jacoco/jacoco.xml
          if-no-files-found: warn
          retention-days: 14
