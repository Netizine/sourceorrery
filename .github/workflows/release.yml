# Manual release: builds the CLI, the C ABI and every SDK package for one
# version, publishes a GitHub Release with checksums and, where the
# registry secret exists, publishes to crates.io, PyPI, npm, NuGet, Maven
# Central, pkg.go.dev and Packagist. Jobs whose secret is absent are
# skipped, and `dry_run` builds and packages everything without creating
# the tag, the release or any registry upload, so the whole pipeline can be
# exercised before any token exists. Procedure: docs/release.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (semver without the v, e.g. 0.2.0)"
        required: true
        type: string
      dry_run:
        description: "Validate and package without uploads or a GitHub Release"
        required: true
        type: boolean
        default: true
      bootstrap_providers:
        description: "First-publish the crates not yet on crates.io (publish-crates.py PROVIDERS: new providers, sourceorrery-os) during this full release using CRATES_BOOTSTRAP_TOKEN"
        required: true
        type: boolean
        default: false

# Read-only by default; the two jobs that write to the repository (the
# GitHub Release and its tag, the Go module tag) ask for `contents: write`
# themselves, and the trusted-publishing jobs for `id-token: write`.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Hosted runners occasionally fail to resolve crates.io; retry harder.
  CARGO_NET_RETRY: "10"

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Decide what this run may do.
  # ---------------------------------------------------------------------
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    # The release gate reads this commit's CI runs and checks.
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      has_npm: ${{ steps.secrets.outputs.has_npm }}
      has_nuget: ${{ steps.secrets.outputs.has_nuget }}
      has_maven: ${{ steps.secrets.outputs.has_maven }}
      has_packagist: ${{ steps.secrets.outputs.has_packagist }}
      has_packaging: ${{ steps.secrets.outputs.has_packaging }}
      has_winget: ${{ steps.secrets.outputs.has_winget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the version and the tag
        id: plan
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semantic version (expected e.g. 0.2.0)"; exit 1
          fi
          if [ "$DRY_RUN" != "true" ] && git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "::error::tag v$VERSION already exists; releases are immutable"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
      # REC01: a release is built only from a commit on main whose CI ran
      # every job and passed, as GitHub Actions reported it. A dry run runs
      # the same gate and reports instead of stopping.
      - name: The release commit passed CI in full
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/release/check-release-validation.py --repo "$REPO" --sha "$SHA" --warn-only
          else
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::a release is dispatched from main, not $REF"; exit 1
            fi
            python3 scripts/release/check-release-validation.py --repo "$REPO" --sha "$SHA"
          fi
      # SR12: the install pages of a release name it, and only it, and no
      # longer say it is unreleased (the CHANGELOG heading names it). A dry
      # run reports instead of stopping.
      - name: The documentation names this release
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if python3 scripts/release/docs-version.py --check --expect "$VERSION"; then
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "::warning title=docs version::the documentation does not name the release $VERSION; a real run stops here"
          else
            echo "::error title=docs version::stamp the documentation for $VERSION (docs/release.md, step 1) and commit it"
            exit 1
          fi
      - name: Require the first-publication credential before building a real release
        if: ${{ inputs.bootstrap_providers && !inputs.dry_run }}
        env:
          CRATES_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_BOOTSTRAP_TOKEN }}
        run: |
          if [ -z "$CRATES_BOOTSTRAP_TOKEN" ]; then
            echo "::error::Set CRATES_BOOTSTRAP_TOKEN for the new provider names, or disable bootstrap_providers once they use Trusted Publishing. See docs/release.md."
            exit 1
          fi
      # crates.io and PyPI use trusted publishing with no switch: their jobs
      # run in every real release and fail loudly if a registry does not
      # trust this workflow.
      - name: Which registry secrets exist
        id: secrets
        shell: bash
        env:
          # npm uses trusted publishing (no token); this repository variable
          # switches it on once each package has its trusted publishers.
          NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
          NUGET_USER: ${{ secrets.NUGET_USER }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          PACKAGING_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          has() { if [ -n "$2" ]; then echo "$1=true"; else echo "$1=false"; fi; }
          {
            if [ "$NPM_TRUSTED_PUBLISHING" = true ]; then echo "has_npm=true"; else echo "has_npm=false"; fi
            has has_nuget "$NUGET_USER"
            has has_maven "${MAVEN_CENTRAL_USERNAME}${MAVEN_CENTRAL_PASSWORD}${MAVEN_GPG_PRIVATE_KEY}"
            has has_packagist "${PACKAGIST_USERNAME}${PACKAGIST_API_TOKEN}"
            has has_packaging "$PACKAGING_TOKEN"
            has has_winget "$WINGET_TOKEN"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Manifests accept the version
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/release/set-version.py "$VERSION"

  # ADR 0007: the version typed for this release must fit the change to the
  # public Rust API of the crates applications build on. cargo-semver-checks
  # compares the stamped manifests with the crates.io baseline and fails a
  # patch release that would need a minor bump (and, from 1.0, a minor
  # release that would need a major). Runs in dry runs too; the GitHub
  # Release waits for it.
  semver:
    name: rust api fits the version
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux build dependencies (Secret Service)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config
      - name: Stamp the version
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: python3 scripts/release/set-version.py "$VERSION"
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: sourceorrery,sourceorrery-core
          rust-toolchain: manual

  # ---------------------------------------------------------------------
  # Software bill of materials: one CycloneDX 1.5 document per shipped
  # binary and target, from the lock files alone (no build), so one runner
  # produces them all: the CLI and the C ABI library for the six targets
  # (every SDK package embeds that library), and the Python and Node
  # extension crates for the six targets (they compile the core in). The
  # files join the release, SHA256SUMS and the provenance attestation.
  # ---------------------------------------------------------------------
  sbom:
    name: software bill of materials
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: sbom
      - name: Stamp the version
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: python3 scripts/release/set-version.py "$VERSION"
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx
      - name: Render one SBOM per binary and target
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                        x86_64-apple-darwin aarch64-apple-darwin \
                        x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            for root in Cargo.toml bindings/python/Cargo.toml bindings/node/Cargo.toml; do
              cargo cyclonedx --manifest-path "$root" --format json --target "$target" \
                --describe binaries --target-in-filename --spec-version 1.5 --no-build-deps
            done
            # cargo-cyclonedx names a file after the Cargo target; the release
            # names it after the archive it describes.
            mv "crates/sourceorrery-cli/sourceorrery_bin_$target.cdx.json" "dist/sourceorrery-$VERSION-$target.cdx.json"
            mv crates/sourceorrery-ffi/sourceorrery_ffi_*_"$target".cdx.json "dist/sourceorrery-ffi-$VERSION-$target.cdx.json"
            mv "bindings/python/sourceorrery_python_cdylib_$target.cdx.json" "dist/sourceorrery-python-$VERSION-$target.cdx.json"
            mv "bindings/node/sourceorrery_node_cdylib_$target.cdx.json" "dist/sourceorrery-node-$VERSION-$target.cdx.json"
          done
          ls dist
          python3 - <<'CHECK'
          import glob, json
          paths = sorted(glob.glob("dist/*.cdx.json"))
          assert len(paths) == 24, f"expected 24 SBOMs, found {len(paths)}"
          for path in paths:
              doc = json.load(open(path))
              assert doc["bomFormat"] == "CycloneDX" and doc["components"], path
              print(f"{path}: {doc['metadata']['component']['name']} {doc['metadata']['component']['version']}, {len(doc['components'])} components")
          CHECK
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/*.cdx.json
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Native artefacts: the CLI and the C ABI for the six Tier 1 targets.
  # ---------------------------------------------------------------------
  # The Linux builds run on Ubuntu 22.04: a binary needs the glibc symbol
  # versions it was linked against, so this sets the floor of the CLI, the
  # C ABI and every package that carries it (.NET, Java): glibc 2.34
  # (Debian 12, Ubuntu 22.04, RHEL 9 and the images built on them). On
  # ubuntu-latest (24.04) it was 2.39.
  # docs/architecture.md (Platform matrix) records each floor.
  native:
    name: native (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  rid: linux-x64,   jdir: linux-x86_64,    archive: tar.gz }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, rid: linux-arm64, jdir: linux-aarch64,   archive: tar.gz }
          - { os: macos-latest,     target: aarch64-apple-darwin,      rid: osx-arm64,   jdir: macos-aarch64,   archive: tar.gz }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,       rid: osx-x64,     jdir: macos-x86_64,    archive: tar.gz }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    rid: win-x64,     jdir: windows-x86_64,  archive: zip }
          - { os: windows-latest,   target: aarch64-pc-windows-msvc,   rid: win-arm64,   jdir: windows-aarch64, archive: zip }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      # set-version.py needs Python 3.11 (tomllib); Ubuntu 22.04's is 3.10.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Linux build dependencies (Secret Service)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config
      - name: Stamp the version
        shell: bash
        run: python3 scripts/release/set-version.py "${{ needs.preflight.outputs.version }}"
      # cargo-auditable embeds the dependency list in each binary (an ELF /
      # Mach-O / PE section), so `cargo audit bin sourceorrery` can check a
      # shipped binary against the advisory database. rust-cache keeps the
      # installed tool between runs.
      - name: Install cargo-auditable
        shell: bash
        run: cargo install --locked cargo-auditable
      - name: Build
        shell: bash
        run: cargo auditable build --release --locked -p sourceorrery-cli -p sourceorrery-ffi --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          out="target/${{ matrix.target }}/release"
          cli="sourceorrery-$VERSION-${{ matrix.target }}"
          ffi="sourceorrery-ffi-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$cli" "dist/$ffi/include" "dist/native/${{ matrix.rid }}" "dist/jni/${{ matrix.jdir }}"
          # Each archive gets the README written for it: the CLI crate's, and the
          # C ABI archive's own (what is inside, who needs it, how to link it).
          cp "$out/sourceorrery" LICENSE-MIT LICENSE-APACHE "dist/$cli/"
          cp crates/sourceorrery-cli/README.md "dist/$cli/README.md"
          # The shared and static libraries only: a libsourceorrery_ffi.* glob would
          # also take the .rlib and the .d dependency file that Cargo leaves there.
          cp "$out"/libsourceorrery_ffi.so "dist/$ffi/" 2>/dev/null || cp "$out"/libsourceorrery_ffi.dylib "dist/$ffi/"
          cp "$out"/libsourceorrery_ffi.a "dist/$ffi/"
          cp crates/sourceorrery-ffi/include/sourceorrery.h bindings/cpp/include/sourceorrery.hpp "dist/$ffi/include/"
          cp scripts/release/ffi-archive-README.md "dist/$ffi/README.md"; cp LICENSE-MIT LICENSE-APACHE "dist/$ffi/"
          tar -C dist -czf "dist/$cli.tar.gz" "$cli"
          tar -C dist -czf "dist/$ffi.tar.gz" "$ffi"
          # Loose shared library for the .NET (runtimes/<rid>/native) and Java (native/<os>-<arch>) packages.
          cp "$out"/libsourceorrery_ffi.so "dist/native/${{ matrix.rid }}/" 2>/dev/null || cp "$out"/libsourceorrery_ffi.dylib "dist/native/${{ matrix.rid }}/"
          cp dist/native/${{ matrix.rid }}/* "dist/jni/${{ matrix.jdir }}/"
          rm -r "dist/$cli" "dist/$ffi"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $out = "target/${{ matrix.target }}/release"
          $cli = "sourceorrery-$env:VERSION-${{ matrix.target }}"
          $ffi = "sourceorrery-ffi-$env:VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$cli", "dist/$ffi/include", "dist/native/${{ matrix.rid }}", "dist/jni/${{ matrix.jdir }}" | Out-Null
          Copy-Item "$out/sourceorrery.exe", "LICENSE-MIT", "LICENSE-APACHE" "dist/$cli/"
          Copy-Item "crates/sourceorrery-cli/README.md" "dist/$cli/README.md"
          Copy-Item "$out/sourceorrery_ffi.dll", "$out/sourceorrery_ffi.dll.lib", "$out/sourceorrery_ffi.lib" "dist/$ffi/"
          Copy-Item "crates/sourceorrery-ffi/include/sourceorrery.h", "bindings/cpp/include/sourceorrery.hpp" "dist/$ffi/include/"
          Copy-Item "scripts/release/ffi-archive-README.md" "dist/$ffi/README.md"; Copy-Item "LICENSE-MIT", "LICENSE-APACHE" "dist/$ffi/"
          Compress-Archive -Path "dist/$cli/*" -DestinationPath "dist/$cli.zip"
          Compress-Archive -Path "dist/$ffi/*" -DestinationPath "dist/$ffi.zip"
          Copy-Item "$out/sourceorrery_ffi.dll" "dist/native/${{ matrix.rid }}/"
          Copy-Item "$out/sourceorrery_ffi.dll" "dist/jni/${{ matrix.jdir }}/"
          Remove-Item -Recurse -Force "dist/$cli", "dist/$ffi"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/native
            dist/jni
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Python wheels (maturin) and the sdist.
  # ---------------------------------------------------------------------
  python:
    name: python (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { os: macos-latest,     target: aarch64-apple-darwin,      manylinux: "" }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,       manylinux: "" }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    manylinux: "" }
          - { os: windows-latest,   target: aarch64-pc-windows-msvc,   manylinux: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Stamp the version
        shell: bash
        run: python3 scripts/release/set-version.py "${{ needs.preflight.outputs.version }}"
      # The sdist is built first, on the host: the wheel build below runs as
      # root inside the manylinux container, and a dist/ directory it created
      # would not be writable by the runner user afterwards.
      - name: Build the sdist
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          command: sdist
          args: --out ../../dist/wheels
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out ../../dist/wheels
          # No sccache: the option leaves RUSTC_WRAPPER=sccache in the job after
          # the containerised build, and a host-side step has no sccache.
          # The Secret Service client needs libdbus in the manylinux container.
          # Both packages come from AlmaLinux's own BaseOS and AppStream, so
          # EPEL is left out: a broken EPEL mirror failed the 0.1.1 release.
          before-script-linux: |
            if command -v dnf >/dev/null; then dnf install -y --disablerepo='epel*' dbus-devel pkgconf-pkg-config; elif command -v apt-get >/dev/null; then apt-get update && apt-get install -y libdbus-1-dev pkg-config; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: dist/wheels
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Node.js: one native addon per target, then the npm packages.
  # ---------------------------------------------------------------------
  node-build:
    name: node (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 for the glibc floor, as for the native job.
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-15-intel,   target: x86_64-apple-darwin }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { os: windows-latest,   target: aarch64-pc-windows-msvc }
    defaults:
      run:
        working-directory: bindings/node
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: bindings/node
          key: ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      # set-version.py needs Python 3.11 (tomllib); Ubuntu 22.04's is 3.10.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Linux build dependencies (Secret Service)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config
      # `npm ci` before stamping: the lock file matches the committed
      # package.json, whose platform packages are `file:npm/<platform>` links;
      # stamping turns those into the version the published package depends on.
      - run: npm ci --ignore-scripts
      - name: Stamp the version
        run: python3 ../../scripts/release/set-version.py "${{ needs.preflight.outputs.version }}"
      - name: Build the addon
        run: npx napi build --platform --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-${{ matrix.target }}
          path: bindings/node/*.node
          if-no-files-found: error
      # `napi build` also generates the loader (index.js) and the types
      # (index.d.ts) the main package ships; they are the same on every
      # target, so one leg keeps them for the packaging job.
      - name: Keep the generated loader and types
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-loader
          path: |
            bindings/node/index.js
            bindings/node/index.d.ts
          if-no-files-found: error

  node-package:
    name: node packages
    needs: [preflight, node-build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/node
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Stamp the version
        run: python3 ../../scripts/release/set-version.py "${{ needs.preflight.outputs.version }}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-*
          path: bindings/node/artifacts
          merge-multiple: true
      - name: The loader and types generated by the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-loader
          path: bindings/node
      - name: Lay out the platform packages
        run: |
          # Regenerates the committed npm/<platform> manifests from the stamped package.json,
          # then replaces napi's one-line READMEs and the copied description with text that
          # says which platform each addon is for and to install @sourceorreryai/sdk instead.
          # The package.json scripts run the @napi-rs/cli pinned by the lock file.
          npm run create-npm-dirs
          python3 ../../scripts/release/npm-platform-packages.py
          npm run artifacts -- --output-dir artifacts
          ls -R npm
          ls -la index.js index.d.ts
      - name: Pack every package
        run: |
          mkdir -p ../../dist/npm
          for dir in npm/*/; do (cd "$dir" && npm pack --pack-destination ../../../../dist/npm); done
          npm pack --pack-destination ../../dist/npm --ignore-scripts
          ls -la ../../dist/npm
      # The 0.1.0 main tarball shipped without the loader and could not be
      # required; this installs what was just packed the way a user would.
      - name: The main package installs and loads the platform package
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          main="$PWD/../../dist/npm/sourceorreryai-sdk-$VERSION.tgz"
          platform="$PWD/../../dist/npm/sourceorreryai-sdk-linux-x64-gnu-$VERSION.tgz"
          listing="$(tar tzf "$main")"
          echo "$listing"
          grep -qx 'package/index.js' <<< "$listing"
          grep -qx 'package/index.d.ts' <<< "$listing"
          grep -qx 'package/README.md' <<< "$listing"
          # Each platform package carries its own README, not napi's one-liner.
          tar xzOf "$platform" package/README.md | grep -q 'Do not install this package directly'
          scratch="$(mktemp -d)"
          cd "$scratch"
          npm init -y >/dev/null
          # The other platform packages are not on the registry yet in a dry run; they are optional.
          npm install --no-audit --no-fund "$main" "$platform"
          node -e "const sdk = require('@sourceorreryai/sdk'); console.log('@sourceorreryai/sdk loads; contract', sdk.contractVersion())"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: dist/npm
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Packages that embed the native library built above.
  # ---------------------------------------------------------------------
  java:
    name: java
    needs: [preflight, native]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/java
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Stamp the version
        run: python3 ../../scripts/release/set-version.py "${{ needs.preflight.outputs.version }}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: bindings/java/native-artifacts
          merge-multiple: true
      - name: Embed the native libraries
        run: |
          mkdir -p src/main/resources/ai/sourceorrery/native
          cp -r native-artifacts/jni/* src/main/resources/ai/sourceorrery/native/
          find src/main/resources -type f
      - name: Build the jar (tests ran in CI)
        run: mvn -B --no-transfer-progress -DskipTests package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-packages
          path: bindings/java/target/*.jar
          if-no-files-found: error

  dotnet:
    name: dotnet
    needs: [preflight, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Stamp the version
        run: python3 scripts/release/set-version.py "${{ needs.preflight.outputs.version }}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: native-artifacts
          merge-multiple: true
      - name: Lay out runtimes/<rid>/native
        run: |
          for rid in native-artifacts/native/*/; do
            rid=$(basename "$rid"); mkdir -p "runtimes/$rid/native"; cp native-artifacts/native/"$rid"/* "runtimes/$rid/native/"
          done
          find runtimes -type f
      - name: Pack
        run: dotnet pack bindings/dotnet/SourceOrrery/SourceOrrery.csproj --nologo -c Release -o dist/nuget -p:Version=${{ needs.preflight.outputs.version }} "-p:SourceOrreryRuntimesDir=$PWD/runtimes"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: dist/nuget
          if-no-files-found: error

  crates:
    name: crates.io (dry run)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config
      - name: Stamp the version
        run: python3 scripts/release/set-version.py "${{ needs.preflight.outputs.version }}"
      - name: Every publishable crate packages and builds in dependency order
        run: python3 scripts/release/publish-crates.py "${{ needs.preflight.outputs.version }}"

  php:
    name: php
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: ffi, json
      - name: The manifest Packagist reads is valid
        run: composer validate --strict composer.json
      - name: The package installs from the release tag through Composer
        run: bash scripts/ci/php-package-install.sh "${{ needs.preflight.outputs.version }}"

  # ---------------------------------------------------------------------
  # The GitHub Release (or, in a dry run, one artifact holding everything).
  # ---------------------------------------------------------------------
  release:
    name: github release
    needs: [preflight, semver, sbom, native, python, node-package, java, dotnet, crates, php]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance for every file on the release (actions/attest-*).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archives-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: release/python
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: release/npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-packages
          path: release/maven
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages
          path: release/nuget
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: release
      - name: Flatten and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for d in python npm maven nuget; do mv "$d"/* . 2>/dev/null || true; rmdir "$d" 2>/dev/null || true; done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # The package-manager manifests are rendered from this file.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: release/SHA256SUMS
          if-no-files-found: error
      - name: Release notes
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          {
            echo "## SourceOrrery $VERSION"
            echo
            echo "Secrets belong to the runtime, not the repository. Install guide: [Getting started](https://sourceorrery.ai/getting-started/); changes: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v$VERSION/CHANGELOG.md)."
            echo
            echo "Start with the CLI: it creates vaults and stores secrets. The SDKs only read them, and are also on their registries (PyPI, npm, crates.io, Maven Central, NuGet, Packagist, pkg.go.dev)."
            echo
            echo "| File | What it is |"
            echo "|------|------------|"
            echo "| \`sourceorrery-$VERSION-<target>.tar.gz\` / \`.zip\` | the \`sourceorrery\` CLI |"
            echo "| \`sourceorrery-ffi-$VERSION-<target>.tar.gz\` / \`.zip\` | the C ABI library and headers, for C, C++, Go and PHP |"
            echo "| \`sourceorrery-$VERSION-cp311-abi3-*.whl\`, \`sourceorrery-$VERSION.tar.gz\` | the Python SDK: wheels and sdist |"
            echo "| \`sourceorreryai-sdk-$VERSION.tgz\`, \`sourceorreryai-sdk-<platform>-$VERSION.tgz\` | the JavaScript / TypeScript SDK and its native addon per platform |"
            echo "| \`sourceorrery-$VERSION.jar\` | the Java SDK, native libraries included |"
            echo "| \`SourceOrrery.$VERSION.nupkg\` | the .NET SDK, native libraries included |"
            echo "| \`sourceorrery-$VERSION-<target>.cdx.json\`, \`sourceorrery-ffi-$VERSION-<target>.cdx.json\`, \`sourceorrery-python-…\`, \`sourceorrery-node-…\` | software bills of materials (CycloneDX 1.5): the Rust dependencies compiled into the CLI, the C ABI library, the Python extension and the Node addon, per target |"
            echo "| \`SHA256SUMS\` | checksums: \`sha256sum -c --ignore-missing SHA256SUMS\` |"
            echo
            echo "Every file above carries a build provenance attestation naming the commit and the workflow run that built it: \`gh attestation verify <file> --repo ${{ github.repository }}\`."
            echo
            echo "Install the CLI with a package manager: \`brew install Netizine/sourceorrery/sourceorrery\` (macOS and Linux), \`winget install Netizine.SourceOrrery\` or \`scoop bucket add sourceorrery https://github.com/Netizine/scoop-sourceorrery && scoop install sourceorrery\` (Windows). WinGet availability depends on catalog approval. Each installs the archive above and checks its hash."
            echo
            echo "Targets: \`x86_64-pc-windows-msvc\`, \`aarch64-pc-windows-msvc\`, \`x86_64-apple-darwin\`, \`aarch64-apple-darwin\`, \`x86_64-unknown-linux-gnu\`, \`aarch64-unknown-linux-gnu\`. How each package is published and how to check it: [Supply chain](https://sourceorrery.ai/security/supply-chain/)."
          } > notes.md
      # Provenance ties each file's digest to this commit and this workflow
      # run, signed through Sigstore and stored with the repository, so a
      # user runs `gh attestation verify <file> --repo Netizine/sourceorrery`.
      # Not in a dry run: an attestation is public and permanent.
      - name: Attest the build provenance of every release file
        if: needs.preflight.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: "Dry run: keep everything as one artifact"
        if: needs.preflight.outputs.publish != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run-${{ needs.preflight.outputs.version }}
          path: |
            release
            notes.md
      - name: Create the GitHub Release and the tag
        if: needs.preflight.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SourceOrrery ${{ needs.preflight.outputs.version }}
          body_path: notes.md
          files: release/*
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------
  # Registry publishing: skipped in a dry run. crates.io, PyPI, npm and
  # NuGet are published by trusted publishing (GitHub OIDC, no stored
  # token), except the opted-in first provider publication below. npm also
  # needs the variable NPM_TRUSTED_PUBLISHING and NuGet the
  # secret NUGET_USER; Maven Central and Packagist are skipped while their
  # secrets are absent; pkg.go.dev needs nothing.
  # ---------------------------------------------------------------------

  # crates.io trusted publishing: crates-io-auth-action trades this job's
  # GitHub OIDC token for a crates.io token that lives 30 minutes, granted
  # only for crates whose Trusted Publishing settings name this repository
  # and release.yml (docs/release.md); its post step revokes the token.
  publish-crates:
    name: publish crates.io
    needs: [preflight, release, crates]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-dev pkg-config
      - run: python3 scripts/release/set-version.py "${{ needs.preflight.outputs.version }}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify packages before obtaining the short-lived publishing token
        run: python3 scripts/release/publish-crates.py "${{ needs.preflight.outputs.version }}"
      - name: crates.io token (GitHub OIDC, 30 minutes)
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # Core's new API must exist before the providers. Established crates
      # retain OIDC; only first publications use the temporary token.
      - name: Publish core for the first provider release (OIDC)
        if: inputs.bootstrap_providers
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: python3 scripts/release/publish-crates.py "$VERSION" --group core --publish
      - name: First-publish the new providers (temporary token)
        if: inputs.bootstrap_providers
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_BOOTSTRAP_TOKEN }}
        run: python3 scripts/release/publish-crates.py "$VERSION" --group providers --publish
      # Exact versions published above are skipped, so configuring the new
      # providers' Trusted Publishers can wait until after this release.
      - name: Publish missing workspace versions in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: python3 scripts/release/publish-crates.py "${{ needs.preflight.outputs.version }}" --publish

  # PyPI trusted publishing: the action trades this job's GitHub OIDC token
  # for a short-lived upload token, granted only if the project's trusted
  # publishers name this repository and release.yml (docs/release.md), and
  # uploads a signed attestation with every file.
  publish-pypi:
    name: publish PyPI
    needs: [preflight, release, python]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  # npm trusted publishing: no token is stored. npm (11.5.1 or later) trades
  # this job's GitHub OIDC token for a short-lived credential, which npm
  # grants only if each package lists this repository and release.yml as a
  # trusted publisher (docs/release.md). Runs when the repository variable
  # NPM_TRUSTED_PUBLISHING is `true`. No `registry-url` on setup-node: it
  # would write an .npmrc with a placeholder token.
  publish-npm:
    name: publish npm
    needs: [preflight, release, node-package]
    if: needs.preflight.outputs.publish == 'true' && needs.preflight.outputs.has_npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm with trusted publishing support
        # An exact version, and no lifecycle scripts (npm has none to run).
        run: npm install --global --ignore-scripts npm@11.21.1 && npm --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: dist/npm
      - name: Publish the platform packages, then the main package
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          cd dist/npm
          main="sourceorreryai-sdk-$VERSION.tgz"
          publish() {
            local name
            name="$(tar -xOzf "$1" package/package.json | jq -r .name)"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm; skipped"
            else
              # ./ makes npm read a file; it reads dist/<file> as GitHub shorthand.
              npm publish "./$1" --access public --provenance
            fi
          }
          for tgz in *.tgz; do [ "$tgz" = "$main" ] || publish "$tgz"; done
          publish "$main"

  # NuGet trusted publishing: no API key is stored. NuGet/login trades this
  # job's GitHub OIDC token for a one-hour key, which nuget.org grants only
  # if a trusted publishing policy names this repository and release.yml
  # (docs/release.md). NUGET_USER is the nuget.org profile name.
  publish-nuget:
    name: publish NuGet
    needs: [preflight, release, dotnet]
    if: needs.preflight.outputs.publish == 'true' && needs.preflight.outputs.has_nuget == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages
          path: dist/nuget
      - name: NuGet login (GitHub OIDC token for a one-hour API key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "dist/nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-maven:
    name: publish Maven Central
    needs: [preflight, release, java]
    if: needs.preflight.outputs.publish == 'true' && needs.preflight.outputs.has_maven == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: python3 ../../scripts/release/set-version.py "${{ needs.preflight.outputs.version }}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: bindings/java/native-artifacts
          merge-multiple: true
      - run: mkdir -p src/main/resources/ai/sourceorrery/native && cp -r native-artifacts/jni/* src/main/resources/ai/sourceorrery/native/
      - name: mvn deploy (Central Publisher Portal)
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B --no-transfer-progress -P release -DskipTests deploy

  publish-go:
    name: publish pkg.go.dev
    needs: [preflight, release]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag the Go module and ask the proxy to index it
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "bindings/go/v$VERSION" "${{ github.sha }}"
          git push origin "bindings/go/v$VERSION"
          # Fetching the version through the public proxy makes pkg.go.dev index it.
          curl -fsS "https://proxy.golang.org/github.com/netizine/sourceorrery/bindings/go/@v/v$VERSION.info" || echo "::warning::proxy fetch failed; it indexes on first use"

  # ---------------------------------------------------------------------
  # Package managers. The formula, the Scoop manifest and the WinGet
  # manifests are rendered from the release's SHA256SUMS in every run (so a
  # dry run checks them); the pushes need PACKAGING_TOKEN (contents: write
  # on Netizine/homebrew-sourceorrery and Netizine/scoop-sourceorrery) and
  # WINGET_TOKEN (a classic token with public_repo, for the pull request to
  # microsoft/winget-pkgs), and are skipped while a token is absent.
  # ---------------------------------------------------------------------
  package-managers:
    name: package managers (render)
    needs: [preflight, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: checksums
      - name: Render the formula and the manifests from SHA256SUMS
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          python3 -m unittest scripts/release/package_managers_test.py
          python3 scripts/release/package-managers.py --version "$VERSION" \
            --sha256sums checksums/SHA256SUMS --release-date "$(date -u +%F)" --out dist
      - name: Check what was rendered
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          ruby -c dist/homebrew/Formula/sourceorrery.rb
          python3 -m json.tool dist/scoop/bucket/sourceorrery.json > /dev/null
          for f in dist/winget/manifests/n/Netizine/SourceOrrery/"$VERSION"/*.yaml; do
            python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' "$f"
          done
          grep -c "$VERSION" dist/homebrew/Formula/sourceorrery.rb dist/scoop/bucket/sourceorrery.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-managers
          path: dist
          if-no-files-found: error

  publish-homebrew-scoop:
    name: publish Homebrew tap and Scoop bucket
    needs: [preflight, package-managers]
    if: needs.preflight.outputs.publish == 'true' && needs.preflight.outputs.has_packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-managers
          path: dist
      - name: Commit the formula to the tap and the manifest to the bucket
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PACKAGING_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
        run: |
          set -euo pipefail
          publish() { # <repository> <rendered file> <path in the repository>
            local repo="$1" src="$2" dest="$3" dir
            dir="$(mktemp -d)"
            git clone --quiet --depth 1 "https://x-access-token:${PACKAGING_TOKEN}@github.com/Netizine/$repo" "$dir"
            if cmp -s "$src" "$dir/$dest"; then echo "$repo already carries $VERSION"; return; fi
            mkdir -p "$dir/$(dirname "$dest")"
            cp "$src" "$dir/$dest"
            git -C "$dir" config user.name "github-actions[bot]"
            git -C "$dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$dir" add "$dest"
            git -C "$dir" commit --quiet -m "sourceorrery $VERSION"
            git -C "$dir" push --quiet
            echo "$repo: $dest -> $VERSION"
          }
          publish homebrew-sourceorrery dist/homebrew/Formula/sourceorrery.rb Formula/sourceorrery.rb
          publish scoop-sourceorrery dist/scoop/bucket/sourceorrery.json bucket/sourceorrery.json

  publish-winget:
    name: publish WinGet
    needs: [preflight, package-managers]
    if: needs.preflight.outputs.publish == 'true' && needs.preflight.outputs.has_winget == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-managers
          path: dist
      - name: Open the pull request on microsoft/winget-pkgs
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $manifests = "dist/winget/manifests/n/Netizine/SourceOrrery/$env:VERSION"
          Get-ChildItem $manifests
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN --prtitle "Netizine.SourceOrrery version $env:VERSION" $manifests

  publish-packagist:
    name: publish Packagist
    needs: [preflight, release, php]
    if: needs.preflight.outputs.publish == 'true' && needs.preflight.outputs.has_packagist == 'true'
    runs-on: ubuntu-latest
    steps:
      # Nothing is uploaded: Packagist reads composer.json at the repository
      # root and turns every tag that has one into a version. The repository
      # must have been submitted once by hand (docs/release.md); this only
      # asks Packagist to re-read it so the new tag appears at once.
      - name: Ask Packagist to re-read the repository
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            "https://packagist.org/api/update-package?username=$PACKAGIST_USERNAME&apiToken=$PACKAGIST_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"repository\":{\"url\":\"$REPOSITORY_URL\"}}")
          cat response.json; echo
          case "$status" in
            2??) ;;
            404) echo "::error::Packagist does not know $REPOSITORY_URL yet: submit it once at https://packagist.org/packages/submit (docs/release.md, 'The PHP package and Packagist')"; exit 1 ;;
            403) echo "::error::Packagist rejected PACKAGIST_USERNAME/PACKAGIST_API_TOKEN"; exit 1 ;;
            *)   echo "::error::Packagist update-package returned HTTP $status"; exit 1 ;;
          esac
      - name: Wait for the version to appear
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          # Packagist keeps the tag's spelling in `version`: v0.1.1, not 0.1.1.
          for _ in $(seq 1 20); do
            if curl -fsS https://repo.packagist.org/p2/sourceorrery/sourceorrery.json \
                | jq -e --arg t "v$VERSION" '.packages["sourceorrery/sourceorrery"] | map(.version) | index($t) != null' >/dev/null 2>&1; then
              echo "sourceorrery/sourceorrery $VERSION is on Packagist"; exit 0
            fi
            sleep 15
          done
          echo "::warning::sourceorrery/sourceorrery $VERSION is not on Packagist after five minutes; check https://packagist.org/packages/sourceorrery/sourceorrery"
