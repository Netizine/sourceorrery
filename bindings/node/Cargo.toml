[package]
name = "sourceorrery-node"
description = "Node.js addon for the SourceOrrery read-only client (built by napi-rs)"
version = "0.2.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Netizine/sourceorrery"
homepage = "https://sourceorrery.ai"
authors = ["James Melvin <james@melvin.tech>"]
publish = false

# Its own workspace root: it is excluded from the repository workspace
# because the napi CLI builds it and it keeps its own lock file.
[workspace]

[lib]
crate-type = ["cdylib"]

[features]
default = ["os-keyring", "remote"]
os-keyring = ["sourceorrery/os-keyring"]
# Every remote provider a vault's connection can reach.
remote = ["sourceorrery/remote"]

[dependencies]
sourceorrery = { path = "../../crates/sourceorrery", version = "0.2.0", default-features = false }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Mirrors the workspace lint table. `deny` rather than `forbid`: the glue
# that `#[napi]` generates is unsafe by nature and carries its own `allow`;
# the hand-written source in src/ contains no unsafe code.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
option_option = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
needless_pass_by_value = "allow"
